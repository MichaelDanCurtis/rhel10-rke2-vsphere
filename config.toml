# bootc-image-builder configuration
# Used when generating the ISO with: --type anaconda-iso --config /config.toml

# ----- Filesystem layout -----
[[customizations.filesystem]]
mountpoint = "/"
minsize = "20 GiB"

[[customizations.filesystem]]
mountpoint = "/var/lib/rancher"
minsize = "60 GiB"

# ----- Anaconda Kickstart (unattended install) -----
# User creation is handled here since bootc-image-builder does not
# allow [[customizations.user]] with custom kickstart content.
# CHANGE the password before building!
[customizations.installer.kickstart]
contents = """
text --non-interactive
zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --noswap --type=lvm
network --bootproto=dhcp --device=link --activate --onboot=on
user --name=admin --groups=wheel --password=changeme --plaintext
"""
